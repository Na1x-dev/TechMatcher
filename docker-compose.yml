services:
  db:
    image: postgres:15-alpine
    container_name: tech_matcher_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME:-tech_matcher}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_EXPOSE_PORT:-5431}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tech_matcher}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tech_matcher_redis
    restart: unless-stopped
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./back
    container_name: tech_matcher_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py ensure_superuser &&
             python manage.py enqueue_catalog_parser_if_needed &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./back:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-tech_matcher}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-techmatcher-dev-key}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Administrator}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_AUTH_CALLBACK_URL: ${GOOGLE_AUTH_CALLBACK_URL:-http://localhost:3000}
      PARSER_ENABLED: ${PARSER_ENABLED:-True}
      PARSER_MIN_PRODUCTS: ${PARSER_MIN_PRODUCTS:-100}
      PARSER_MAX_PAGES: ${PARSER_MAX_PAGES:-10}
      PARSER_PAGE_SIZE: ${PARSER_PAGE_SIZE:-30}
      PARSER_REQUEST_TIMEOUT: ${PARSER_REQUEST_TIMEOUT:-25}
      PARSER_DELAY_MIN: ${PARSER_DELAY_MIN:-0.8}
      PARSER_DELAY_MAX: ${PARSER_DELAY_MAX:-1.8}
      PARSER_SOURCE_URL: ${PARSER_SOURCE_URL:-https://catalog.onliner.by/mobile}
      PARSER_USER_AGENT: ${PARSER_USER_AGENT:-TechMatcherCatalogBot/1.0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: ./back
    container_name: tech_matcher_celery
    restart: unless-stopped
    command: celery -A tech_matcher worker --loglevel=info
    volumes:
      - ./back:/app
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-tech_matcher}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-techmatcher-dev-key}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: ./back
    container_name: tech_matcher_celery_beat
    restart: unless-stopped
    command: celery -A tech_matcher beat --loglevel=info
    volumes:
      - ./back:/app
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-tech_matcher}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-techmatcher-dev-key}
      PARSER_ENABLED: ${PARSER_ENABLED:-True}
      PARSER_MIN_PRODUCTS: ${PARSER_MIN_PRODUCTS:-100}
      PARSER_MAX_PAGES: ${PARSER_MAX_PAGES:-10}
      PARSER_PAGE_SIZE: ${PARSER_PAGE_SIZE:-30}
      PARSER_REQUEST_TIMEOUT: ${PARSER_REQUEST_TIMEOUT:-25}
      PARSER_DELAY_MIN: ${PARSER_DELAY_MIN:-0.8}
      PARSER_DELAY_MAX: ${PARSER_DELAY_MAX:-1.8}
      PARSER_SOURCE_URL: ${PARSER_SOURCE_URL:-https://catalog.onliner.by/mobile?mobile_type%5B0%5D=smartphone&mobile_type%5Boperation%5D=union&page=}
      PARSER_USER_AGENT: ${PARSER_USER_AGENT:-TechMatcherCatalogBot/1.0}
      PARSER_SCHEDULE_MINUTES: ${PARSER_SCHEDULE_MINUTES:-15}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./front
    container_name: tech_matcher_frontend
    restart: unless-stopped
    volumes:
      - ./front:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  postgres_data:
